[project]
name = "persian-data-dashboard"
version = "1.0.0"
description = "RTL Streamlit dashboard for Persian data analytics and interactive charts"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.45",
    "pandas>=2.2",
    "numpy>=2.1",
    "plotly>=5.24",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "python-json-logger>=3.2",
    "pyarrow>=18.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
